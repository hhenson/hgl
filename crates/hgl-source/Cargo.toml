[package]
name = "hgl-source"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.hgl]
line-budget = 2090

# Budgets of the modules that were crates of their own (docs/decisions/0004).
[package.metadata.hgl.modules]
native_package = { budget = 80, uses = ["native_descriptor"] }
native_descriptor = { budget = 140, uses = [] }
lex = { budget = 180, uses = [] }

[dependencies]
hgl-types = { path = "../hgl-types" }
hgl-value-model = { path = "../hgl-value-model" }

[lints]
workspace = true
