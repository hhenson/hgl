[package]
name = "hgl-alloc-count"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Test-only: a global allocator that counts, so a test can assert that a tick allocates nothing."

# This crate cannot inherit the workspace lints: they forbid `unsafe`, and a
# global allocator cannot be written without it. It is test tooling and is
# never linked into the runtime (docs/decisions/0003). The rest of the
# workspace policy is restated here.
[package.metadata.hgl]
line-budget = 80

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
