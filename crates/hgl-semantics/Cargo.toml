[package]
name = "hgl-semantics"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "HGL semantics: the program model, its checks and the IR the backend reads."

[package.metadata.hgl]
line-budget = 9590

# Budgets of the modules that were crates of their own (docs/decisions/0004).
[package.metadata.hgl.modules]
call_locals = { budget = 80, uses = ["ir", "ir_visit"] }
constructor_growth = { budget = 40, uses = ["ir", "ir_visit"] }
constructor_owners = { budget = 100, uses = ["constructor_growth", "ir", "ir_visit", "value_constant"] }
boxed_uses = { budget = 80, uses = ["ir", "ir_visit"] }
any_values = { budget = 420, uses = ["ir", "value_eval", "endpoint_check", "value_access", "family_values", "scalar_keys"] }
value_constructors = { budget = 100, uses = ["ir", "value_eval", "endpoint_check", "value_access", "any_values"] }
value_operators = { budget = 120, uses = [] }
default_values = { budget = 220, uses = ["ir", "library", "value_eval", "value_types", "inheritance", "enums"] }
body_check = { budget = 220, uses = ["ir", "library"] }
collection_check = { budget = 180, uses = ["collection_values", "ir", "value_access", "value_constant", "value_eval", "any_values"] }
delta_check = { budget = 350, uses = ["composite_keys", "ir"] }
endpoint_check = { budget = 220, uses = ["tuple_values", "ir", "value_bind"] }
enums = { budget = 250, uses = ["library", "struct_names"] }
eval_data = { budget = 350, uses = ["ir", "library", "publication_trace", "value_eval"] }
family_types = { budget = 300, uses = ["inheritance", "library", "struct_names", "value_access"] }
flow_check = { budget = 150, uses = ["ir"] }
harness = { budget = 250, uses = ["collection_values", "eval_data", "family_values", "harness_ir", "ir", "value_eval", "any_values"] }
harness_check = { budget = 180, uses = ["eval_data", "flow_check", "harness_ir", "ir", "static_values", "library", "value_types"] }
inheritance = { budget = 300, uses = ["enums", "library", "struct_names"] }
library = { budget = 500, uses = ["struct_declarations", "ir", "native_contracts"] }
local_check = { budget = 220, uses = ["endpoint_check", "ir", "structural_admission", "tuple_admission", "value_check"] }
name_check = { budget = 250, uses = ["tuple_flow", "tuple_phase", "enums", "library", "struct_names", "type_sizes"] }
native_contracts = { budget = 350, uses = ["library", "struct_names", "ir"] }
recursive_types = { budget = 350, uses = ["enums", "library", "shape_obligations", "struct_names", "value_access"] }
shape_obligations = { budget = 150, uses = ["library", "struct_names", "value_access"] }
source_check = { budget = 550, uses = ["tuple_writes", "tuple_flow", "tuple_phase", "ir", "enums", "eval_data", "library", "name_check", "type_sizes", "value_access", "value_check", "value_types"] }
static_values = { budget = 150, uses = ["any_values", "composite_keys", "ir", "library", "value_constant", "value_eval"] }
struct_check = { budget = 450, uses = ["enums", "family_types", "inheritance", "ir", "library", "type_sizes", "value_access", "value_types", "default_values"] }
struct_declarations = { budget = 200, uses = [] }
struct_names = { budget = 160, uses = ["library"] }
type_sizes = { budget = 180, uses = ["ir", "value_check", "value_eval"] }
tuple_admission = { budget = 60, uses = ["structural_admission", "ir", "endpoint_check", "tuple_values"] }
tuple_flow = { budget = 60, uses = ["name_check", "tuple_phase", "tuple_writes"] }
tuple_phase = { budget = 100, uses = ["library", "name_check", "struct_names"] }
tuple_writes = { budget = 100, uses = ["name_check", "tuple_phase", "tuple_flow"] }
tuple_values = { budget = 100, uses = ["endpoint_check", "ir"] }
value_access = { budget = 200, uses = ["ir", "library", "static_values"] }
value_bind = { budget = 500, uses = ["native_contracts", "ir", "library", "source_check", "value_access", "value_types"] }
value_check = { budget = 400, uses = ["tuple_admission", "tuple_values", "ir", "library", "value_access", "value_constant", "value_operators"] }
value_operations = { budget = 250, uses = ["endpoint_check", "collection_values", "family_values", "ir", "any_values", "value_constructors"] }
value_types = { budget = 350, uses = ["native_contracts", "enums", "family_types", "inheritance", "library", "recursive_types", "shape_obligations", "struct_names", "type_sizes", "value_access", "value_check"] }
wiring_locals = { budget = 300, uses = ["ir", "local_check", "value_access", "value_check", "value_eval"] }

structural_admission = { budget = 100, uses = ["ir", "tuple_values", "endpoint_check"] }

wiring_mutation = { budget = 100, uses = ["ir_visit", "ir", "value_eval", "wiring_values"] }
wiring_values = { budget = 160, uses = ["wiring_mutation", "ir", "ir_visit", "value_eval"] }

[dependencies]
hgl-eval = { path = "../hgl-eval" }
hgl-source = { path = "../hgl-source" }
hgl-types = { path = "../hgl-types" }

[lints]
workspace = true
