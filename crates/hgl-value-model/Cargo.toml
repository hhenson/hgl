[package]
name = "hgl-value-model"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Syntax-neutral ordinary metadata, checked IR and contextual materialization."

[package.metadata.hgl]
line-budget = 1100

[package.metadata.hgl.modules]
ordinary_shape = { budget = 120, uses = ["type_shape"] }
scalar_shape = { budget = 80, uses = [] }
diagnostics = { budget = 200, uses = [] }
literals = { budget = 150, uses = ["type_shape"] }
nominal_batch = { budget = 160, uses = [] }
time_context = { budget = 200, uses = ["literals"] }
type_shape = { budget = 230, uses = ["nominal_batch"] }
ir = { budget = 180, uses = [] }

[dependencies]
hgl-types = { path = "../hgl-types" }
jiff.workspace = true

[lints]
workspace = true
