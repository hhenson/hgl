[package]
name = "hgl-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Test support for the runtime: the case tables and the eval harness that runs them."

[package.metadata.hgl]
line-budget = 950

# Budgets of the modules that were crates of their own (docs/decisions/0004).
[package.metadata.hgl.modules]
proto_nodes = { budget = 300, uses = [] }

[dependencies]
hgl-describe = { path = "../hgl-describe" }
hgl-kernel = { path = "../hgl-kernel" }
hgl-store = { path = "../hgl-store" }
hgl-types = { path = "../hgl-types" }

[dev-dependencies]
hgl-alloc-count = { path = "../hgl-alloc-count" }

[lints]
workspace = true
