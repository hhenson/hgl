[package]
name = "hgl-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Where time-series live and how a tick travels: every value, last-modified time and binding of a run."

[package.metadata.hgl]
line-budget = 500

[dependencies]
hgl-prepared-store = { path = "../hgl-prepared-store" }
hgl-optional = { path = "../hgl-optional" }
hgl-atomic = { path = "../hgl-atomic" }
hgl-shapes = { path = "../hgl-shapes" }
hgl-columns = { path = "../hgl-columns" }
hgl-bindings = { path = "../hgl-bindings" }
hgl-types = { path = "../hgl-types" }
hgl-global = { path = "../hgl-global" }

hgl-keys = { path = "../hgl-keys" }
hgl-store-build = { path = "../hgl-store-build" }

[dev-dependencies]
hgl-time-context = { path = "../hgl-time-context" }
hgl-literals = { path = "../hgl-literals" }
hgl-alloc-count = { path = "../hgl-alloc-count" }


[lints]
workspace = true
