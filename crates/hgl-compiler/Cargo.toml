[package]
name = "hgl-compiler"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.hgl]
line-budget = 2470

# Budgets of the modules that were crates of their own (docs/decisions/0004).
[package.metadata.hgl.modules]
reject = { budget = 250, uses = ["test_annotations", "test_units"] }
test_annotations = { budget = 220, uses = [] }
test_runner = { budget = 250, uses = ["reject"] }
test_units = { budget = 350, uses = [] }

[[bin]]
name = "hglc"
path = "src/main.rs"

[dependencies]
hgl-program = { path = "../hgl-program" }
hgl-semantics = { path = "../hgl-semantics" }
hgl-source = { path = "../hgl-source" }

[lints]
workspace = true
