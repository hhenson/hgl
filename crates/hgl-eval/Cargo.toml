[package]
name = "hgl-eval"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Checked ordinary IR execution without source parsing or name resolution."

[package.metadata.hgl]
line-budget = 2000

[package.metadata.hgl.modules]
any_values = { budget = 420, uses = ["ir", "value_eval", "family_values", "scalar_keys"] }
ir_visit = { budget = 320, uses = ["ir", "harness_ir"] }
collection_values = { budget = 200, uses = ["composite_keys", "family_values", "ir", "any_values", "value_eval"] }
composite_keys = { budget = 150, uses = ["ir", "scalar_keys", "any_values", "family_values"] }
family_values = { budget = 100, uses = ["ir"] }
harness_ir = { budget = 200, uses = ["ir", "value_eval"] }
ir = { budget = 0, uses = [] }
publication_trace = { budget = 150, uses = ["composite_keys", "ir"] }
scalar_keys = { budget = 100, uses = [] }
value_constant = { budget = 100, uses = ["ir", "ir_visit"] }
value_eval = { budget = 500, uses = ["value_constant", "collection_values", "publication_trace", "family_values", "ir", "value_operations", "any_values"] }
value_operations = { budget = 250, uses = ["collection_values", "family_values", "ir", "any_values"] }

[dependencies]
hgl-value-model = { path = "../hgl-value-model" }
hgl-types = { path = "../hgl-types" }

[lints]
workspace = true
