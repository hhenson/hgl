[package]
name = "hgl-rust"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.hgl]
line-budget = 1700

[package.metadata.hgl.modules]
conditionals = { budget = 240, uses = ["finite_domains", "cold_wiring", "graph_assemblies"] }
reference_routes = { budget = 120, uses = ["graph_assemblies"] }
graph_assemblies = { budget = 100, uses = [] }
native_images = { budget = 100, uses = [] }
capacity = { budget = 400, uses = ["snapshots", "collections", "deltas", "finite_domains", "keyed", "layouts", "pure_bounds", "windows", "any_values", "any_expression"] }
generators = { budget = 500, uses = ["observed", "constructor_owners", "snapshot_slots", "any_prepared", "deltas", "finite_domains", "source_slots", "values", "windows"] }
preparation = { budget = 300, uses = ["checked_data", "collections", "families", "layouts", "recursive_convert", "value_convert", "values"] }

cold_wiring = { budget = 160, uses = ["cold_transport", "checked_data", "native_values", "preparation", "values"] }

[dependencies]
hgl-rust-codegen = { path = "../hgl-rust-codegen" }
hgl-semantics = { path = "../hgl-semantics" }
hgl-source = { path = "../hgl-source" }
hgl-types = { path = "../hgl-types" }

[lints]
workspace = true
