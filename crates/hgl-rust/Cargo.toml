[package]
name = "hgl-rust"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.hgl]
line-budget = 8940

# Budgets of the modules that were crates of their own (docs/decisions/0004).
[package.metadata.hgl.modules]
capacity = { budget = 400, uses = ["snapshots", "collections", "deltas", "finite_domains", "keyed", "layouts", "pure_bounds", "windows"] }
checked_data = { budget = 250, uses = ["enums", "type_data"] }
collections = { budget = 250, uses = ["families", "prepared_values"] }
composite_keys = { budget = 250, uses = [] }
deltas = { budget = 700, uses = ["keyed", "layouts", "observed", "windows"] }
direct_deltas = { budget = 400, uses = ["layouts", "observed"] }
enums = { budget = 180, uses = ["prepared_values"] }
execution_proof = { budget = 250, uses = ["direct_deltas", "mutation_bounds"] }
families = { budget = 200, uses = ["type_data"] }
finite_domains = { budget = 250, uses = ["execution_proof", "layouts", "mutation_bounds"] }
generators = { budget = 500, uses = ["deltas", "finite_domains", "source_slots", "values", "windows"] }
key_origins = { budget = 180, uses = [] }
keyed = { budget = 450, uses = ["checked_data", "key_origins", "layouts", "value_convert"] }
layouts = { budget = 400, uses = ["snapshots", "collections", "composite_keys", "enums", "families", "prepared_values", "scalars", "structs"] }
mutation_bounds = { budget = 250, uses = [] }
observed = { budget = 500, uses = ["deltas", "composite_keys", "layouts", "windows"] }
preparation = { budget = 300, uses = ["checked_data", "collections", "families", "layouts", "recursive_convert", "value_convert", "values"] }
prepared_values = { budget = 250, uses = [] }
pure_bounds = { budget = 300, uses = [] }
recursive_convert = { budget = 160, uses = ["checked_data", "layouts"] }
scalars = { budget = 150, uses = [] }
snapshot_slots = { budget = 350, uses = ["layouts", "observed", "snapshots"] }
snapshots = { budget = 300, uses = ["layouts"] }
source_slots = { budget = 100, uses = ["layouts"] }
structs = { budget = 230, uses = ["collections", "prepared_values"] }
type_data = { budget = 120, uses = ["enums"] }
value_convert = { budget = 320, uses = ["checked_data", "collections", "families", "layouts"] }
tuple_adapter = { budget = 60, uses = ["execution_proof"] }
values = { budget = 800, uses = ["snapshot_slots", "snapshots", "collections", "deltas", "direct_deltas", "finite_domains", "layouts", "observed", "windows"] }
windows = { budget = 100, uses = ["layouts"] }

[dependencies]
hgl-semantics = { path = "../hgl-semantics" }
hgl-source = { path = "../hgl-source" }
hgl-types = { path = "../hgl-types" }

[lints]
workspace = true
