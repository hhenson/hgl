name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Windows runs the whole gate nightly and on request, not per pull request:
  # it catches path and linker differences, and at twice Linux's time it was
  # the long pole of every review.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that is not a test run: the Python fixture and audit checks,
  # format, clippy, docs, deny and the budgets, and the compiler-tools spike.
  # macOS is validated locally before pushing; hosted macOS minutes are costly
  # on a private repository. rustup on the runner installs the toolchain that
  # rust-toolchain.toml pins.
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          stage: checks
      - run: python tools/fixed_fixtures.py --check
      - run: python tools/description_fixtures.py --check
      - run: python docs/runtime_spec/validation/descriptions/check.py
      - run: python -m unittest discover -s docs/runtime_spec/validation/descriptions -p "test_*.py"
      - run: python tools/stdlib_fixtures.py --check
      - run: python external/hgraph_spec_audit/tools/shared_artifacts.py --offline
      - run: python -m unittest discover -s external/hgraph_spec_audit/compiler/stdlib -p "test_*.py"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - name: Verify audited native interface fingerprints
        run: python external/hgraph_spec_audit/compiler/native_interfaces/check.py --hgl .
      - run: python tools/bootstrap_reference.py
      - name: Verify recorded wiring assessment
        run: |
          python docs/runtime_spec/validation/wiring/check.py
          python -c "import json; from pathlib import Path; assert json.loads(Path('docs/runtime_spec/validation/wiring/assessment.json').read_text()) == json.loads(Path('external/hgraph_spec_audit/runtime/validation/wiring/assessment.json').read_text()), 'wiring assessment differs from pinned evidence'"
      - run: cargo xtask ci format clippy docs deny budget
      - run: cargo fmt --manifest-path experiments/compiler-tools/Cargo.toml -- --check
      - run: cargo clippy --manifest-path experiments/compiler-tools/Cargo.toml --all-targets -- -D warnings
      - run: python experiments/compiler-tools/run.py --output "${{ runner.temp }}/compiler-tools-results"

  # The two test profiles overlap instead of following each other. Debug
  # builds check the assertions; release builds run what ships.
  tests:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: debug
            gate: test
          - stage: release
            gate: test --release
    name: tests (${{ matrix.stage }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          stage: ${{ matrix.stage }}
      - run: python external/hgraph_spec_audit/tools/shared_artifacts.py --offline
      - run: cargo xtask ci "${{ matrix.gate }}"

  windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          stage: windows
      - run: python tools/fixed_fixtures.py --check
      - run: python tools/description_fixtures.py --check
      - run: python docs/runtime_spec/validation/descriptions/check.py
      - run: python -m unittest discover -s docs/runtime_spec/validation/descriptions -p "test_*.py"
      - run: python tools/stdlib_fixtures.py --check
      - run: python external/hgraph_spec_audit/tools/shared_artifacts.py --offline
      - run: python -m unittest discover -s external/hgraph_spec_audit/compiler/stdlib -p "test_*.py"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - name: Verify audited native interface fingerprints
        run: python external/hgraph_spec_audit/compiler/native_interfaces/check.py --hgl .
      - run: python tools/bootstrap_reference.py
      - run: cargo xtask ci
      - run: cargo fmt --manifest-path experiments/compiler-tools/Cargo.toml -- --check
      - run: cargo clippy --manifest-path experiments/compiler-tools/Cargo.toml --all-targets -- -D warnings
      - run: python experiments/compiler-tools/run.py --output "${{ runner.temp }}/compiler-tools-results"

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned shared sources
        run: python tools/shared_artifacts.py
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: experiments/compiler-tools/Cargo.toml
