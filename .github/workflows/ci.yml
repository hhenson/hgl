name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS is validated locally before pushing; hosted macOS minutes are costly
  # on a private repository. rustup on the runner installs the toolchain that
  # rust-toolchain.toml pins.
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: python tools/fixed_fixtures.py --check
      - run: python tools/description_fixtures.py --check
      - run: python docs/runtime_spec/validation/descriptions/check.py
      - run: python -m unittest discover -s docs/runtime_spec/validation/descriptions -p "test_*.py"
      - run: python tools/stdlib_fixtures.py --check
      - run: python -m unittest discover -s docs/compiler/stdlib -p "test_*.py"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: cargo xtask ci
      - run: cargo fmt --manifest-path experiments/compiler-tools/Cargo.toml -- --check
      - run: cargo clippy --manifest-path experiments/compiler-tools/Cargo.toml --all-targets -- -D warnings
      - run: python experiments/compiler-tools/run.py --output "${{ runner.temp }}/compiler-tools-results"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: experiments/compiler-tools/Cargo.toml

  native-interface:
    runs-on: ubuntu-24.04
    env:
      # Update deliberately with the upstream interface/compiler migration.
      HGRAPH_REVISION: b5c644e330086b09dd27ac7bd421157e91e22dd7
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler build dependencies
        run: python -m pip install "cmake==4.4.2" "ninja==1.13.0" "pyarrow==25.0.0"
      - name: Fetch the pinned upstream compiler
        run: |
          git init "$RUNNER_TEMP/hgraph"
          git -C "$RUNNER_TEMP/hgraph" fetch --depth 1 https://github.com/hhenson/hgraph.git "$HGRAPH_REVISION"
          git -C "$RUNNER_TEMP/hgraph" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hgraph" rev-parse HEAD)" = "$HGRAPH_REVISION"
      - name: Build the upstream compiler
        run: |
          cmake -S "$RUNNER_TEMP/hgraph" -B "$RUNNER_TEMP/hgraph-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DHGRAPH_BUILD_LANGUAGE=ON -DHGRAPH_BUILD_PYTHON_BINDINGS=OFF \
            -DHGRAPH_ENABLE_PYTHON_USER_NODES=OFF -DHGRAPH_ENABLE_IDE_PYTHON_HEADER_HINTS=OFF \
            -DHGRAPH_USE_PYARROW_ARROW=ON -DHGRAPH_ENABLE_COMPILER_CACHE=OFF \
            -DPython_EXECUTABLE="$(command -v python)"
          cmake --build "$RUNNER_TEMP/hgraph-build" --target hgl --parallel 2
      - name: Check the shared interface and generated Rust trait
        run: >-
          python tools/native_bindings.py --check
          --compiler "$RUNNER_TEMP/hgraph-build/language/hgl"
          --interface "$RUNNER_TEMP/hgraph/language/stdlib/hgl/hgraph/native/scalar_values_i64.hgl"
          --implementation "$RUNNER_TEMP/hgraph/language/stdlib/hgl/hgraph/native/impl/rust_scalar_values_i64.hgl"
          --capability-interface "$RUNNER_TEMP/hgraph/language/tests/codegen/native-provider.hgl"
          --capability-implementation "$RUNNER_TEMP/hgraph/language/tests/codegen/native-provider-rust-impl.hgl"
