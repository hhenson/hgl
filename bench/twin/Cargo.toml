[package]
name = "hgl-bench-twin"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Rust half of each benchmark pair; see bench/README.md."

[[bin]]
name = "hgl_twin"
path = "src/main.rs"

[package.metadata.hgl]
line-budget = 300

[dependencies]
hgl-types = { path = "../../crates/hgl-types" }
hgl-store = { path = "../../crates/hgl-store" }
hgl-kernel = { path = "../../crates/hgl-kernel" }
hgl-describe = { path = "../../crates/hgl-describe" }
hgl-proto-nodes = { path = "../../crates/hgl-proto-nodes" }

# Only the tests count allocations: the program that is measured must not pay
# for counting them.
[dev-dependencies]
hgl-alloc-count = { path = "../../crates/hgl-alloc-count" }

[lints]
workspace = true
